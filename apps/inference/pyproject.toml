[project]
name = "beneath-pine-inference"
version = "0.1.0"
description = "Private local inference gateway for Beneath Pine AI adapters."
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3,<1"]

[tool.uv]
dev-dependencies = ["pytest>=8,<9", "httpx>=0.27,<1"]
