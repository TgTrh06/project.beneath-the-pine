name: beneath-the-pine-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: btp_review
      POSTGRES_USER: btp_local
      POSTGRES_PASSWORD: btp_local_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btp_local -d btp_review"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - btp_postgres_local:/var/lib/postgresql/data

volumes:
  btp_postgres_local:
    name: beneath-the-pine-postgres-local
