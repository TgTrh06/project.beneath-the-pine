name: ${PYNEATH_COMPOSE_PROJECT:-pyneath-local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PYNEATH_POSTGRES_DB:-pyneath_review}
      POSTGRES_USER: ${PYNEATH_POSTGRES_USER:-pyneath_local}
      POSTGRES_PASSWORD: ${PYNEATH_POSTGRES_PASSWORD:-pyneath_local_password}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - pyneath_postgres_local:/var/lib/postgresql/data

volumes:
  pyneath_postgres_local:
    name: ${PYNEATH_POSTGRES_VOLUME:-pyneath-postgres-local}
