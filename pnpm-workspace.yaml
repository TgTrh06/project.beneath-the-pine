packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: false

# Scoped, same-major security updates for dependencies pinned by upstream tools.
overrides:
  'express>body-parser': '2.4.0'
  'express>proxy-addr': '2.0.8'
  '@nestjs/platform-express>multer': '2.5.0'
  'superagent>qs': '6.16.1'
  'express>qs': '6.16.1'
  'postcss>source-map-js': '1.2.2'
  'ajv>fast-uri': '3.1.9'
  'minimatch@3>brace-expansion': '1.1.21'
  'minimatch@10>brace-expansion': '5.0.12'
